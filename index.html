<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex Lutz</title>
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body Styling */
        body {
            font-family: 'Arial', sans-serif;
            color: #333;
            background: linear-gradient(120deg, #e0f7fa, #b3e5fc);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Header Styling */
        h1 {
            font-size: 3rem;
            color: #0077cc;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        /* Link Styling */
        a {
            color: #ffffff;
            text-decoration: none;
            background-color: #0077cc;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        a:hover {
            background-color: #005f99;
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }

        /* Footer Styling */
        footer {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #555;
        }
    </style>
</head>
<body>
    <h1>Welcome to Alex Lutz's Corner!</h1>
    <p>I'm Alex, a DevOps and FinOps consultant, passionate about helping businesses optimize their cloud infrastructure and reduce costs.</p>
    <p>Connect with me:</p>
    <a href="https://github.com/alexinslc" target="_blank">GitHub</a>
    <a href="https://linkedin.com/in/alexinslc" target="_blank">LinkedIn</a>

    <footer>
        <p>&copy; <span id="year"></span> Alex Lutz | Built with ❤️ on GitHub Pages</p>
    </footer>

    <script>
        // Dynamic Year for the Footer
        document.getElementById("year").textContent = new Date().getFullYear();
    </script>
</body>
</html>
