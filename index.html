<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="keywords" content="DevOps, FinOps, Cloud Architecture, Leadership, Infrastructure">
    <link rel="canonical" href="https://alexinslc.com/">

    <meta property="og:url" content="https://alexinslc.com/">
    <meta property="og:title" content="Alex Lutz | DevOps Leader">
    <meta property="og:description" content="DevOps leader focused on building reliable systems and leading teams that ship great things">
    <meta property="og:image" content="https://alexinslc.com/web-app-manifest-512x512.png">
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://alexinslc.com/">
    <meta name="twitter:title" content="Alex Lutz | DevOps Leader">
    <meta name="twitter:description" content="DevOps leader focused on building reliable systems and leading teams that ship great things">
    <meta name="twitter:image" content="https://alexinslc.com/web-app-manifest-512x512.png">
    
    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon-96x96.png" type="image/png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <style>
        :root {
            --bg: #fafafa;
            --text: #333333;
            --text-light: #666666;
            --border: #e0e0e0;
            --card: #ffffff;
            --accent: #555555;
        }
        .card {
            border: 1px solid var(--border);
            transition: opacity 0.2s ease;
        }
        .card:hover {
            opacity: 0.8;
        }
        .social-link {
            transition: opacity 0.2s ease;
        }
        .social-link:hover {
            opacity: 0.7;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 sm:p-8" style="background: var(--bg); color: var(--text);">
    <div class="max-w-4xl w-full space-y-8 sm:space-y-12 py-10 sm:py-16">
        <!-- Profile Section -->
        <div class="text-center space-y-6 sm:space-y-8">
            <div class="w-16 h-16 sm:w-24 sm:h-24 mx-auto rounded-full border" style="border-color: var(--border); background: var(--card); display: flex; align-items: center; justify-content: center;">
                <span class="text-2xl sm:text-3xl">👨‍💻</span>
            </div>
            <h1 class="text-3xl sm:text-4xl font-light" style="color: var(--text);">Hi, I'm Alex</h1>
            <p class="text-base sm:text-lg" style="color: var(--text-light);">Dad, DevOps leader, optimist</p>
            <p class="text-sm sm:text-base max-w-xl mx-auto px-4" style="color: var(--text);">Building reliable systems and leading teams that ship great things.</p>
        </div>

        <!-- About Section -->
        <div class="max-w-2xl mx-auto text-center space-y-4 py-4 sm:py-8">
            <div class="text-center">
                <p class="text-sm" style="color: var(--text-light);">DevOps • FinOps • Leadership • Cloud Architecture</p>
            </div>
        </div>

        <!-- Social Links -->
        <div class="flex flex-col sm:flex-row justify-center space-y-3 sm:space-y-0 sm:space-x-6 mt-6 sm:mt-10">
            <a href="https://github.com/alexinslc" target="_blank" 
               class="px-6 py-3 rounded-lg text-base font-medium social-link"
               style="background: var(--card); color: var(--text); border: 1px solid var(--border); text-decoration: none;">
                GitHub
            </a>
            <a href="https://www.linkedin.com/in/alexlutz" target="_blank" 
               class="px-6 py-3 rounded-lg text-base font-medium social-link"
               style="background: var(--card); color: var(--text); border: 1px solid var(--border); text-decoration: none;">
                LinkedIn
            </a>
            <a href="mailto:alexinslc@gmail.com" 
               class="px-6 py-3 rounded-lg text-base font-medium social-link"
               style="background: var(--card); color: var(--text); border: 1px solid var(--border); text-decoration: none;">
                Contact
            </a>
        </div>

        <!-- Footer -->
        <footer class="mt-12 sm:mt-16 text-sm text-center" style="color: var(--text-light);">
            &copy; <span id="year"></span> Alex Lutz
        </footer>
    </div>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
    
    <!-- JSON-LD for Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Alex Lutz",
      "url": "https://alexinslc.com",
      "image": "https://alexinslc.com/web-app-manifest-512x512.png",
      "jobTitle": "DevOps Leader",
      "description": "Building reliable systems and leading teams that ship great things.",
      "sameAs": [
        "https://github.com/alexinslc",
        "https://www.linkedin.com/in/alexlutz"
      ],
      "knowsAbout": ["DevOps", "FinOps", "Cloud Architecture", "Leadership"]
    }
    </script>
</body>
</html>
